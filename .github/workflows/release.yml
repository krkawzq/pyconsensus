name: Release

# Build a manylinux abi3 wheel and publish to PyPI via Trusted Publishing (OIDC).
# Triggered by pushing a tag named `v*` (e.g. v0.1.0). No PyPI API token is
# needed — the workflow identity (repo + workflow + environment) is registered
# as a trusted publisher on the PyPI project `py-consensus`.
#
# PyPI trusted publisher setup (one-time, manual):
#   https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#   PyPI project: py-consensus
#   Owner:        krkawzq
#   Repo:         pyconsensus
#   Workflow:     release.yml
#   Environment:  pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for PyPI trusted publishing (OIDC)

env:
  CARGO_TERM_COLOR: always
  HTSLIB_REF: 9d53dcaa

jobs:
  build-wheel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install htslib build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool make gcc \
            zlib1g-dev libbz2-dev liblzma-dev libzstd-dev

      - name: Build manylinux abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -o dist
          # manylinux2014 image: broadly compatible glibc baseline, plus the
          # autotools / zlib / bz2 / lzma / zstd -dev headers maturin-action
          # provisions inside the container.
          target: x86_64-unknown-linux-gnu
          before-script-linux: |
            yum install -y autoconf automake libtool make gcc \
              zlib-devel bzip2-devel xz-devel zstd-devel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    needs: build-wheel
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/py-consensus/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # print-hashes here doubles as a final "what got published" summary.
          print-hash: true
          skip-existing: true
