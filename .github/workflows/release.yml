name: Release

# Build a manylinux abi3 wheel and publish to PyPI using an API token stored
# in the repository secret `PYPI_API_TOKEN`. Triggered by pushing a tag named
# `v*` (e.g. v0.1.0), or manually via workflow_dispatch.
#
# The wheel is built inside a manylinux container. build.rs compiles htslib
# and the five compression libs (zlib / bzip2 / xz / libdeflate / zstd) from
# source with -fPIC, so the container only needs autotools + cmake + make.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  HTSLIB_REF: 9d53dcaa

jobs:
  build-wheel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build manylinux abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -o dist
          # manylinux_2_28 (glibc 2.28) is the newest x86_64 image maturin-action
          # provisions; broader compatibility than 2_34 and matches what PyO3
          # publishes. build.rs compiles htslib + the 5 compression libs from
          # source with -fPIC, so we only need autotools/cmake in the container.
          manylinux: "2_28"
          before-script-linux: |
            yum install -y autoconf automake libtool make gcc cmake \
              zlib-devel bzip2-devel xz-devel zstd-devel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    needs: build-wheel
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/pyconsensus-rs/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          # print-hashes doubles as a final "what got published" summary.
          print-hash: true
          # Re-running a release tag shouldn't 400 on an already-published
          # version; skip instead so the workflow stays green.
          skip-existing: true
