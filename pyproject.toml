[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
# PyPI distribution name is "pyconsensus-rs": the bare "pyconsensus" name on
# PyPI is taken by an unrelated Augur project, and PyPI normalizes hyphens/
# underscores so "py-consensus" / "py_consensus" collide with it too. The "-rs"
# suffix disambiguates and signals the Rust implementation. The Python import
# name stays "pyconsensus" — see [tool.maturin].module-name / python-source.
name = "pyconsensus-rs"
version = "0.1.0"
description = "Rust rewrite of bcftools consensus for online enformer expression data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
features = ["python"]
module-name = "pyconsensus._engine"
python-source = "."
include = [
    "pyconsensus/__init__.py",
    "pyconsensus/_engine.pyi",
    "pyconsensus/engine.py",
    "pyconsensus/py.typed",
]
